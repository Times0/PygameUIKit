[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[project]
name = "PygameUIKit"
version = "0.2.0"
description = "Small, composable UI widgets for Pygame"
readme = "README.md"
authors = [{ name = "Times0", email = "times.coding@gmail.com" }]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.txt"]
dependencies = ["pygame-ce>=2.5.8,<3"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: pygame",
]

[project.urls]
Source = "https://github.com/Times0/PygameUIKit"
Issues = "https://github.com/Times0/PygameUIKit/issues"

[project.scripts]
pygameuikit-demo = "PygameUIKit.demo:main"

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14,<1"]

[tool.uv.build-backend]
module-name = "PygameUIKit"
source-include = ["tests/**"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
